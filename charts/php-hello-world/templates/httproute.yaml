{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: php-hello-world
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- $annotations := .Values.commonAnnotations | default dict }}
  {{- if .Values.httproute.hostnames }}
  {{- $annotations = merge (dict) $annotations (dict "link.argocd.argoproj.io/external-link" (printf "https://%s" (first .Values.httproute.hostnames))) }}
  {{- end }}
  {{- with $annotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- toYaml .Values.httproute.parentRefs | nindent 4 }}
  {{- with .Values.httproute.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httproute.rules }}
    - {{- with .matches }}
      matches: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters: {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ default (include "common.names.fullname" $) $.Values.httproute.backendRef.serviceName }}
          port: {{ default $.Values.service.ports.http $.Values.httproute.backendRef.port }}
          weight: 1
    {{- end }}
{{- end }}
