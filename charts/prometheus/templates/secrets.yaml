{{- if .Values.basicAuth.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.basicAuth.secretName }}
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.basicAuth.secretName }}
    template:
      type: Opaque
      data:
        .htpasswd: |-
          {{ `{{ htpasswd "` }}{{ .Values.basicAuth.username }}{{ `" .password "sha" }}` }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.basicAuth.vaultKey }}
        property: {{ .Values.basicAuth.vaultProperty }}
{{- end }}
