{{- if .Values.basicAuth.enabled }}
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: {{ .Values.prometheus.server.fullnameOverride }}-basic-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.prometheus.server.fullnameOverride }}
  basicAuth:
    secretRef:
      name: {{ .Values.basicAuth.secretName }}
      key: .htpasswd
{{- end }}
