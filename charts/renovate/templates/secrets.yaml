apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ template "common.names.fullname" . }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: renovate-env
    template:
      type: Opaque
      data:
        RENOVATE_TOKEN: "{{ `{{ .renovate_token | toString }}` }}"
        RENOVATE_DOCKER_DHI_IO_USERNAME: "{{ `{{ .dhi_username | toString }}` }}"
        RENOVATE_DOCKER_DHI_IO_PASSWORD: "{{ `{{ .dhi_token | toString }}` }}"
        RENOVATE_GITHUB_COM_TOKEN: "{{ `{{ .github_com_token | toString }}` }}"
    creationPolicy: Owner
  data:
    - secretKey: renovate_token
      remoteRef:
        key: secrets/data/kubernetes/renovate
        property: codeberg_token
    - secretKey: dhi_username
      remoteRef:
        key: secrets/data/kubernetes/renovate
        property: dhi_username
    - secretKey: dhi_token
      remoteRef:
        key: secrets/data/kubernetes/renovate
        property: dhi_token
    - secretKey: github_com_token
      remoteRef:
        key: secrets/data/kubernetes/renovate
        property: github_com_token
