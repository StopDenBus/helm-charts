httproute:
  enabled: true
  hostnames:
    - loki.apps.gusek.info
  backendRef:
    serviceName: loki
    port: 3100
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: https
      namespace: kgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      per_stream_rate_limit: 5M
      per_stream_rate_limit_burst: 20M
      retention_period: 336h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    pattern_ingester:
      enabled: false
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: zfs
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  rbac:
    pspEnabled: false
