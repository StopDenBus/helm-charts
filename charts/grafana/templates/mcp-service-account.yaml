{{- if .Values.mcpServiceAccount.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-mcp-setup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-mcp-setup
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.mcpServiceAccount.tokenSecretName | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-mcp-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-mcp-setup
subjects:
  - kind: ServiceAccount
    name: grafana-mcp-setup
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-mcp-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: grafana-mcp-setup
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: {{ .Values.mcpServiceAccount.image }}
          env:
            - name: HOME
              value: /tmp
            - name: GRAFANA_URL
              value: {{ .Values.mcpServiceAccount.grafanaUrl | quote }}
            - name: SA_NAME
              value: {{ .Values.mcpServiceAccount.name | quote }}
            - name: SA_ROLE
              value: {{ .Values.mcpServiceAccount.role | quote }}
            - name: TOKEN_SECRET
              value: {{ .Values.mcpServiceAccount.tokenSecretName | quote }}
            - name: GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpServiceAccount.adminSecretName }}
                  key: admin-user
            - name: GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpServiceAccount.adminSecretName }}
                  key: admin-password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until curl -fsS "$GRAFANA_URL/api/health" >/dev/null; do
                echo "waiting for grafana"
                sleep 5
              done

              api() {
                method="$1"; path="$2"; shift 2
                curl -fsS -X "$method" -u "$GRAFANA_USER:$GRAFANA_PASSWORD" \
                  -H "Content-Type: application/json" "$@" "$GRAFANA_URL$path"
              }

              if kubectl get secret "$TOKEN_SECRET" >/dev/null 2>&1; then
                token="$(kubectl get secret "$TOKEN_SECRET" -o jsonpath='{.data.token}' | base64 -d)"
                if curl -fsS -H "Authorization: Bearer $token" "$GRAFANA_URL/api/org" >/dev/null 2>&1; then
                  echo "token in secret $TOKEN_SECRET is still valid"
                  exit 0
                fi
                echo "token in secret $TOKEN_SECRET is not valid anymore, creating a new one"
              fi

              id="$(api GET "/api/serviceaccounts/search?query=$SA_NAME" | jq -r --arg n "$SA_NAME" '.serviceAccounts[] | select(.name == $n) | .id' | head -n 1)"
              if [ -z "$id" ]; then
                id="$(api POST /api/serviceaccounts -d "{\"name\":\"$SA_NAME\",\"role\":\"$SA_ROLE\"}" | jq -r .id)"
                echo "created service account $SA_NAME (id $id)"
              else
                api PATCH "/api/serviceaccounts/$id" -d "{\"role\":\"$SA_ROLE\"}" >/dev/null
                echo "service account $SA_NAME (id $id) exists, role set to $SA_ROLE"
              fi

              for tid in $(api GET "/api/serviceaccounts/$id/tokens" | jq -r '.[].id'); do
                api DELETE "/api/serviceaccounts/$id/tokens/$tid" >/dev/null
              done

              token="$(api POST "/api/serviceaccounts/$id/tokens" -d "{\"name\":\"$SA_NAME\"}" | jq -r .key)"
              [ -n "$token" ] && [ "$token" != "null" ]

              kubectl create secret generic "$TOKEN_SECRET" --from-literal=token="$token" --dry-run=client -o yaml | kubectl apply -f -
              echo "stored token in secret $TOKEN_SECRET"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
