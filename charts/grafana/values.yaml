grafana:
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: zfs
    size: 2Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: Hosts
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: grafana-dashboards
  admin:
    existingSecret: "grafana-admin-password"
    passwordKey: admin-password
    userKey: admin-user
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: loki
          access: proxy
          isDefault: true
          jsonData:
            maxLines: 1000
          type: loki
          url: http://loki:3100
        - name: prometheus
          access: proxy
          type: prometheus
          url: http://prometheus-server
          jsonData:
            timeInterval: 60s
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: clientSecret
  grafana.ini:
    auth.generic_oauth:
      allow_sign_up: true
      api_url: https://dex.apps.gusek.info/dex/userinfo
      auth_url: https://dex.apps.gusek.info/dex/auth
      client_id: grafana
      email_attribute_path: email
      enabled: true
      name: Dex
      scopes: openid profile email groups
      token_url: https://dex.apps.gusek.info/dex/token
    auth.generic_oauth.group_mapping:
      role_attribute_path: contains(groups[*], 'grafana-admin@gusek.info') && 'Admin' || contains(groups[*], 'grafana-editor@gusek.info') && 'Editor' || 'Viewer'
      org_id: 1      
    server:
      root_url: https://grafana.apps.gusek.info
  route:
    main:
      enabled: true
      annotations:
        link.argocd.argoproj.io/external-link: https://grafana.apps.gusek.info
      hostnames:
        - grafana.apps.gusek.info
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: https
          namespace: kgateway-system
  testFramework:
    enabled: false   